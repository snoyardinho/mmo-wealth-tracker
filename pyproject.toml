[project]
name = "mmo-wealth-tracker"
version = "0.1.0"
description = "Track MMO market trading and wealth from screenshots"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.13", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
